<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNMO — Práctica de 100 preguntas</title>
<style>
  :root{
    --ink:#16202b;
    --ink-soft:#5b6b7c;
    --paper:#f2f4f6;
    --card:#ffffff;
    --line:#d5dce3;
    --un:#2b6cb0;
    --ok:#1b7f4b;
    --bad:#b8321f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font:16px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  header{
    background:var(--un);
    color:#fff;
    padding:28px 20px 24px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.2px}
  header p{margin:6px 0 0;opacity:.85;font-size:15px}
  .bar{
    position:sticky;top:0;z-index:5;
    background:rgba(255,255,255,.95);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
    padding:10px 20px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;
    display:flex;gap:16px;align-items:center;justify-content:space-between;
  }
  .bar strong{font-weight:600}
  main{padding:24px 20px 60px}
  .q{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    padding:18px 20px;
    margin:0 0 14px;
  }
  .q.correct{border-left-color:var(--ok)}
  .q.wrong{border-left-color:var(--bad)}
  .meta{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;
  }
  .stem{margin:0 0 12px;font-size:17px}
  label{
    display:flex;gap:10px;align-items:flex-start;
    padding:8px 10px;margin:2px -10px;
    cursor:pointer;border-radius:3px;
  }
  label:hover{background:#eef3f8}
  input[type=radio]{margin-top:5px;accent-color:var(--un)}
  .key{font-family:system-ui,sans-serif;font-size:14px;color:var(--ink-soft);min-width:16px}
  label.is-right{background:#e6f4ec}
  label.is-right .key{color:var(--ok);font-weight:700}
  label.is-picked-wrong{background:#fbeae7}
  label.is-picked-wrong .key{color:var(--bad);font-weight:700}
  .why{
    margin:12px 0 0;padding:10px 12px;
    background:#f6f8fa;border-left:2px solid var(--un);
    font-size:15px;color:#33414f;
  }
  .why b{font-weight:600}
  button{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;padding:11px 20px;border:0;border-radius:4px;
    background:var(--un);color:#fff;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--un);border:1px solid var(--un)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 0}
  .result{
    background:var(--card);border:1px solid var(--line);
    padding:22px;margin:26px 0 0;display:none;
  }
  .result.show{display:block}
  .score{font-size:40px;font-weight:600;margin:0}
  .score small{font-size:17px;color:var(--ink-soft);font-weight:400}
  .verdict{margin:4px 0 0;color:var(--ink-soft)}
  :focus-visible{outline:2px solid var(--un);outline-offset:2px}
  @media (max-width:520px){ .stem{font-size:16px} header h1{font-size:21px} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>UNMO — Práctica de evaluaciones</h1>
    <p>100 preguntas del material CPTM 2025. Las opciones se mezclan en cada intento.</p>
  </div>
</header>

<div class="bar">
  <div class="wrap" style="display:flex;gap:16px;justify-content:space-between;width:100%">
    <span>Respondidas: <strong id="count">0</strong> / 100</span>
    <span id="livescore"></span>
  </div>
</div>

<main class="wrap">
  <div id="quiz"></div>

  <div class="actions">
    <button id="grade">Corregir examen</button>
    <button id="reset" class="ghost">Reiniciar</button>
  </div>

  <div class="result" id="result">
    <p class="score"><span id="pts">0</span>/100 <small id="pct"></small></p>
    <p class="verdict" id="verdict"></p>
    <div class="actions">
      <button id="firstWrong" class="ghost">Ir al primer error</button>
      <button id="reset2" class="ghost">Reiniciar</button>
    </div>
  </div>
</main>

<script>
// [n, lección, dificultad, enunciado, [A,B,C,D], índiceCorrecto, justificación]
const DATA = [
[1,"1.1 Nivel estratégico","Fácil","According to the United Nations Charter, which authority holds the official role of 'Chief Administrative Officer' of the organization?",["The Special Representative of the Secretary-General (SRSG).","The UN Secretary-General.","The President of the General Assembly.","The President of the Security Council."],1,"The Secretary-General is the chief administrative officer of the UN under the UN Charter, leading the Secretariat."],
[2,"1.1 Nivel estratégico","Fácil","Which principal organ of the United Nations holds the primary responsibility for financing and approving the budget assessments of all peacekeeping operations?",["The Military Staff Committee.","The UN Security Council.","The Department of Peace Operations (DPO).","The UN General Assembly."],3,"The General Assembly is sovereign in managing and approving the organization's general budget and individual Member State assessments for missions."],
[3,"1.1 Nivel estratégico","Fácil","Which principal organ of the United Nations has the primary responsibility for maintaining international peace and security under the express terms of the UN Charter?",["The Economic and Social Council (ECOSOC).","The UN Secretariat.","The General Assembly.","The UN Security Council."],3,"The Security Council has the primary responsibility for maintaining international peace and security and is the only organ that issues binding resolutions."],
[4,"1.1 Nivel estratégico","Fácil","According to the structures established at the strategic level, through which two main departments does the UN Secretariat plan, manage, and logistically support field missions?",["UNDSS and the Human Rights Council.","UNHCR and the Office for the Coordination of Humanitarian Affairs (OCHA).","Department of Peace Operations (DPO) and Department of Operational Support (DOS).","Department of Political and Peacebuilding Affairs (DPPA) and UNDP."],2,"DPO is responsible for political and tactical direction, while DOS manages the daily support and logistics of all peace operations."],
[5,"1.1 Nivel estratégico","Fácil","What uniquely characterizes the 'Multidimensional' nature of modern UN peacekeeping operations?",["The unilateral delegation of all sovereign functions of the host country to the Force Commander.","The exclusive use of marines in cross-border air missions.","The active integration of military, police, and civilian components working together to address the root causes of conflict.","The absolute prohibition of civilian presence within the operational bases of the blue helmets."],2,"Modern multidimensional operations integrate military, police, and civilian specialists to support peace processes and rebuild institutions."],
[6,"1.2 Actividades de paz","Fácil","In the spectrum of peace and security activities conducted by the UN, which activity focuses on the use of diplomatic and preventive measures to prevent local tensions and disputes from escalating into open armed conflict?",["Conflict Prevention.","Peacekeeping.","Peacebuilding.","Peace Enforcement."],0,"Conflict Prevention acts early and peacefully (via preventive diplomacy) to prevent the initial outbreak of armed clashes."],
[7,"1.2 Actividades de paz","Fácil","Which activity involves diplomatic actions, such as mediation and negotiation, designed to bring hostile parties to a peaceful agreement, typically under Chapter VI of the UN Charter?",["Peace Enforcement.","Peacemaking.","Peacebuilding.","Conflict Prevention."],1,"Peacemaking relies on diplomatic tools to negotiate ceasefire agreements and political settlements between warring parties."],
[8,"1.2 Actividades de paz","Fácil","Which activity is defined as an operational tool deployed to preserve a fragile peace, monitor ceasefires, and support the implementation of peace agreements, usually with the consent of the parties?",["Peacekeeping.","Peace Enforcement.","Peacemaking.","Conflict Prevention."],0,"Peacekeeping is the deployment of a UN presence in the field, with the consent of the parties, to help maintain peace."],
[9,"1.2 Actividades de paz","Fácil","Under Chapter VII of the United Nations Charter, what distinguishes 'Peace Enforcement' from traditional peacekeeping operations?",["It requires the explicit consent of all regional rebel groups before any deployment.","It is restricted to civilian administrative support, prohibiting any military presence.","It allows the use of coercive measures, including military force, to restore peace without requiring the consent of the parties.","It must be financed exclusively by voluntary donations from local NGOs."],2,"Peace Enforcement allows coercive, non-consensual military action authorized by the Security Council to restore international peace and security."],
[10,"1.2 Actividades de paz","Fácil","What is the primary objective of 'Peacebuilding' (Consolidation of Peace) after the end of an armed conflict?",["To disarm all state security forces and replace them permanently with UN personnel.","To rebuild national capacities, address the root causes of conflict, and prevent a relapse into violence.","To establish a military government led by the Force Commander.","To manage commercial activities and collect national taxes to pay for the mission."],1,"Peacebuilding works on medium- and long-term stabilization, strengthening national institutions to prevent the recurrence of violent conflict."],
[11,"1.3 Principios","Fácil","What are the three fundamental principles that serve as the foundation and continue to guide all UN peacekeeping operations in the field?",["Shared sovereignty, preventive use of offensive lethal force, and federal prison management.","Absolute neutrality, forced disarmament of civilians, and commercial legal arbitration.","Consent of the parties, impartiality, and non-use of force except in self-defense and defense of the mandate.","Tactical government support, armed combat against insurgents, and preventive aerial surveillance."],2,"These three basic principles form the core triad that distinguishes peacekeeping from purely offensive or unilateral enforcement actions."],
[12,"1.3 Principios","Fácil","Why is the principle of 'Consent of the Parties' so vital for the success and safety of a UN peacekeeping operation?",["Because it guarantees that the mission can establish its own laws and taxes in the country.","Because it provides the mission with political legitimacy, freedom of movement, and reduces the likelihood of attacks against personnel.","Because it allows the UN to arrest political leaders without judicial warrants.","Because it forces TCCs to finance their own operations in the field."],1,"Consent ensures that the host government and key actors accept the UN presence, granting legitimacy and operational freedom of movement."],
[13,"1.3 Principios","Fácil","In UN doctrine, what is the correct definition of the principle of 'Impartiality' for peacekeepers in the field?",["To remain completely inactive and neutral, ignoring even grave violations of the peace agreement by either side.","To support the military operations of the host government against any political opposition.","To implement the mandate strictly and without bias to all parties, without taking sides or ignoring violations of the mandate.","To favor the weaker party in a conflict to balance the political situation."],2,"Impartiality means executing the mandate fairly and objectively for all parties, without bias, and registering infractions neutrally."],
[14,"1.3 Principios","Fácil","Under what specific circumstances is a UN peacekeeping operation authorized to use force in the field?",["To conduct offensive military campaigns to capture and eliminate political opponents of the host state.","Only when authorized by local police commanders of the host country.","In self-defense, in defense of other UN personnel, and in defense of the mandate (such as protecting civilians under imminent threat).","Whenever the military contingent needs to secure local commercial resources for its logistics."],2,"Force is used as a measure of last resort, strictly in self-defense, defense of UN personnel/installations, or in defense of the mandate (like POC)."],
[15,"1.3 Principios","Fácil","What occurs if a UN peacekeeping operation loses its 'Credibility' among the local population and the parties in conflict?",["The mission's budget is automatically doubled by the General Assembly.","Consent may be withdrawn, security risks increase dramatically, and the implementation of the mandate becomes severely hindered.","The host country is expelled from the United Nations.","The Force Commander assumes the presidency of the host country."],1,"Loss of credibility erodes local trust, putting unarmed observers at high risk and compromising the mission's political legitimacy."],
[16,"1.5 Mandatos y resoluciones","Fácil","In the UN system of peace operations, from where does the legal authority and mandate to deploy a peacekeeping operation in the field originate?",["From a commercial cooperation agreement signed by the World Bank and ECOSOC.","From an executive decree of the International Court of Justice.","From a circular letter issued unilaterally by the Secretary-General.","From a Resolution formally approved by the UN Security Council."],3,"The Security Council is the only competent body under the UN Charter to issue the Resolutions that establish a mission's mandate and legal boundaries."],
[17,"1.5 Mandatos y resoluciones","Fácil","What is the primary purpose of the 'Concept of Operations' (CONOPS) developed during the planning phase of a mission?",["To define the commercial and trade rules of the host country.","To translate the political mandate of the Security Council into an operational plan, detailing military, police, and civilian tasks.","To establish the legal defense guidelines for local rebels in municipal courts.","To schedule the recreational activities of the military contingents."],1,"The CONOPS is the operational plan that details how the political mandate issued by the Security Council will be executed on the ground."],
[18,"1.5 Mandatos y resoluciones","Fácil","Which document, approved during the planning of a mission, defines the rules and limitations regarding when and how military contingents may use force in the field?",["The Status of Forces Agreement (SOFA).","The UN Rules of Engagement (ROE).","The United Nations Sustainable Development Cooperation Framework (UNSDCF).","The Mission Budget Plan."],1,"The Rules of Engagement (ROE) are specific directives that authorize and limit the use of military force by peacekeepers."],
[19,"1.5 Mandatos y resoluciones","Fácil","What is the 'Status of Forces Agreement' (SOFA) signed between the United Nations and the host government?",["A commercial treaty that regulates the export of minerals by the host country.","A military alliance where the host country agrees to fight alongside UN forces.","An agreement that establishes the legal status, privileges, immunities, and rights of the mission and its personnel within the host territory.","A bilateral contract that defines the salaries of local civilian employees."],2,"The SOFA ensures the legal status of the mission, granting privileges and immunities necessary for personnel to operate safely and independently."],
[20,"1.5 Mandatos y resoluciones","Fácil","What does the acronym 'UNSDCF' stand for in the context of UN strategic partnerships?",["United Nations Security and Defence Cooperation Force.","United Nations Sustainable Development Cooperation Framework.","United Nations Social Development and Crisis Foundation.","United Nations Sovereign Debt and Financial Commission."],1,"The UNSDCF is the primary strategic tool guiding the joint development and humanitarian actions of the UN Country Team (UNCT) in a country."],
[21,"1.6 Mecanismo de operaciones","Fácil","In the chain of command of a UN peace operation, who holds the final authority to delegate and establish operational control over the field forces?",["The UN Secretary-General, based on the mandate delegated by the Security Council.","The constitutional courts of the host country.","The minister of defense of the main contributing country (TCC).","The municipal governors in the areas where the bases are located."],0,"The Secretary-General holds the delegated authority from the Security Council to command and logistically manage all peacekeeping operations."],
[22,"1.6 Mecanismo de operaciones","Fácil","In a multidimensional UN mission, who is the head of the mission and exercises unified authority over all military, police, and civilian components?",["The Chief Military Observer (CMO).","The Special Representative of the Secretary-General (SRSG).","The Military Force Commander.","The Police Commissioner (PC)."],1,"The SRSG is the political leader of the mission, exercising unified control over military, police, and civilian components."],
[23,"1.6 Mecanismo de operaciones","Fácil","What is 'Operational Control' (OPCON) in the context of UN peacekeeping forces?",["The authority of the host state to use UN troops for national border defense.","The power of a contributing nation (TCC) to change the mission's rules of engagement unilaterally.","The authority delegated to the UN Force Commander to direct and deploy assigned national contingents for specific tasks.","The right of civilian local officials to inspect the weapons of the blue helmets."],2,"OPCON allows the UN Force Commander to direct assigned national contingents for tactical tasks, while administrative control remains with the home nation."],
[24,"1.6 Mecanismo de operaciones","Fácil","What are 'National Caveats' in UN peacekeeping operations, and how do they affect the mission?",["They are tax exemptions granted to local merchants supplying the mission.","They are national restrictions placed by contributing countries on the use of their forces, which can hinder operational flexibility.","They are military badges awarded to officers completing more than one year of service.","They are diplomatic credentials given to local translators."],1,"National Caveats are unilateral restrictions on troop use imposed by TCCs/PCCs, which often compromise tactical flexibility and unity of command."],
[25,"1.6 Mecanismo de operaciones","Fácil","Who commands the military component of a UN peacekeeping operation in the field under the direction of the SRSG?",["The Police Commissioner (PC).","The Chief of Mission Support (CMS).","The Military Force Commander.","The Chief Military Observer (CMO)."],2,"The Force Commander is the senior officer in command of all assigned military contingents and staff officers."],
[26,"1.7 Trabajar como uno","Moderada","What does 'Integration' mean in a multidimensional UN peacekeeping operation?",["The assimilation of local culture by UN personnel, including adopting national uniforms.","The merging of all UN agencies into a single military unit led by national officers.","The strategic alignment and coordination of military, police, and civilian components to achieve a unified peace strategy.","The outsourcing of all security services to local private security companies."],2,"Integration aligns the civilian, police, and military components of a mission with the UN Country Team under a single strategic framework."],
[27,"1.7 Trabajar como uno","Moderada","What is the primary role of the United Nations Police (UNPOL) in a peacekeeping operation?",["To conduct combat operations against rebel groups in rural jungles.","To support the host state in the reform, restructuring, and rebuilding of its law enforcement institutions, and, where mandated, provide interim policing.","To manage the court system and sentence criminal suspects.","To guard the maritime borders and collect customs duties."],1,"UNPOL focuses on building local police capacities, reforming law enforcement, and providing operational or executive support when mandated."],
[28,"1.7 Trabajar como uno","Fácil","What is the 'Joint Mission Analysis Centre' (JMAC) in a UN peace operation?",["A coordination cell that manages commercial flights and cargo at national airports.","An integrated unit that collects, analyzes, and synthesizes information from all sources to produce predictive assessments of security and political trends.","A judicial committee that prosecutes internal disciplinary cases of the mission.","A recreational facility for officers of different nationalities."],1,"The JMAC is an integrated intelligence and analysis unit that provides the Head of Mission with strategic and predictive risk assessments."],
[29,"1.7 Trabajar como uno","Fácil","What is the 'Joint Operations Centre' (JOC) in a UN peacekeeping mission?",["A legal clinic that provides defense for local civilian detainees.","An operations room that provides continuous, 24/7 situational awareness, coordinates daily activities, and manages crisis response.","A regional bank that finances local infrastructure projects.","A warehouse that stores spare parts for military vehicles."],1,"The JOC coordinates operational reporting, monitors daily activities, and acts as the central hub for real-time crisis management."],
[30,"1.7 Trabajar como uno","Fácil","What is the role of the 'Civilian Component' in a multidimensional UN peacekeeping operation?",["To replace all local judicial and legislative authorities permanently.","To provide technical, political, humanitarian, human rights, and administrative support to implement the mandate.","To train local military forces in offensive combat tactics.","To manage the commercial import of goods for the host country."],1,"Civilians lead political mediation, human rights monitoring, child protection, gender affairs, and administrative support within the integrated mission."],
[31,"1.8 Socios de la misión","Fácil","Who belongs to the 'United Nations Country Team' (UNCT) in the host country of a peacekeeping operation?",["The military commanders of neighbouring countries.","All the UN funds, programmes, and specialized agencies (such as UNICEF, UNDP, WHO) operating in the host country.","The main political opposition parties of the host country.","The local private security companies contracted by the mission."],1,"The UNCT comprises the developmental and humanitarian agencies, funds, and programmes of the UN system represented in the host country."],
[32,"1.8 Socios de la misión","Fácil","What is the role of 'Non-Governmental Organizations' (NGOs) as partners in a peacekeeping environment?",["To vote on Security Council resolutions regarding the mission's mandate.","To provide independent humanitarian assistance, development aid, and advocacy, operating alongside but separate from the UN.","To manage the command and control of the UN military contingents.","To issue diplomatic visas to international staff."],1,"NGOs are vital partners that deliver humanitarian aid, though they maintain operational independence to preserve their neutrality."],
[33,"1.8 Socios de la misión","Fácil","What is the primary function of the 'International Committee of the Red Cross' (ICRC) in a conflict zone?",["To assist the host government in purchasing military equipment.","To provide neutral, independent protection and assistance to victims of armed conflict and internal violence, including visiting detainees.","To coordinate the offensive air patrols of the UN military component.","To draft the constitution of post-conflict host states."],1,"The ICRC is an independent, neutral organization dedicated to humanitarian protection and monitoring compliance with International Humanitarian Law."],
[34,"1.8 Socios de la misión","Fácil","Which regional organization frequently partners with the United Nations in planning and deploying peace operations, especially in Africa?",["The Association of Southeast Asian Nations (ASEAN).","The African Union (AU).","The Organization of American States (OAS).","The European Union (EU)."],1,"The African Union (AU) is a key strategic partner of the UN, frequently co-deploying or handing over operations to UN peacekeeping missions."],
[35,"1.8 Socios de la misión","Fácil","What is the primary role of the 'World Bank' as a partner in post-conflict reconstruction?",["To deploy private military forces to secure trade routes.","To provide long-term financial assistance, loans, and policy advice for economic development and institutional rebuilding.","To manage the local municipal police forces directly.","To supply food and medicine directly in refugee camps."],1,"The World Bank focuses on economic recovery, systemic poverty reduction, and institutional reform in post-conflict countries."],
[36,"2.1 Tareas del mandato","Fácil","What is the difference between a 'Traditional' and a 'Multidimensional' UN peacekeeping operation?",["Traditional operations use only civilian personnel, while multidimensional operations are purely military.","Traditional operations focus primarily on military tasks (monitoring ceasefires, separating forces), while multidimensional operations combine military, police, and civilian components to address root causes of conflict.","Traditional operations are deployed without Security Council authorization, while multidimensional operations require it.","Traditional operations last less than a month, while multidimensional ones are permanent."],1,"Traditional missions monitor ceasefires and lines of separation, whereas multidimensional missions support complex political, security, and human rights reforms."],
[37,"2.1 Tareas del mandato","Fácil","In a multidimensional UN mission, what is the process of 'Disarmament, Demobilization, and Reintegration' (DDR)?",["A program to deport all foreign workers from the host country.","A process to disarm ex-combatants, remove them from military structures, and assist them in returning to civil society.","A military tactic to destroy national weapons factories.","An administrative policy to reduce the salaries of UN personnel."],1,"DDR helps stabilize post-conflict areas by taking weapons from ex-combatants, demobilizing armed groups, and supporting their social reintegration."],
[38,"2.1 Tareas del mandato","Fácil","What does the term 'Security Sector Reform' (SSR) mean in a peacekeeping mandate?",["The complete replacement of the national army with private security contractors.","The process of assisting the host state in rebuilding, reforming, and professionalizing its security institutions (military, police, border guard) under democratic control.","The closure of all local police stations and prisons.","The outsourcing of national borders to regional security organizations."],1,"SSR supports the host state in establishing effective, accountable, and professional security institutions under civilian oversight."],
[39,"2.1 Tareas del mandato","Fácil","What is the role of UN peacekeeping operations in supporting 'Rule of Law' and national judicial systems?",["To prosecute and sentence local criminals in UN-run military courts.","To assist the host state in strengthening, professionalizing, and reforming its judiciary, court administration, and prison systems.","To dissolve all local laws and replace them with international maritime codes.","To draft the criminal statutes of neighboring nations."],1,"Rule of Law assistance aims to rebuild the host country's judicial and corrections capacity, ensuring fair and independent justice systems."],
[40,"2.1 Tareas del mandato","Fácil","What is the primary role of the 'Civil Affairs' component in a multidimensional UN mission?",["To command military patrols in urban areas.","To foster political dialogue, support local conflict resolution, and build national capacity at the municipal and regional levels.","To audit the national bank of the host state.","To register marriages and births for the local population."],1,"Civil Affairs officers operate at regional and local levels, facilitating conflict resolution, social cohesion, and municipal institutional support."],
[41,"2.3 Derechos humanos","Moderada","In the United Nations system of human rights protection, what is the technical distinction between a human rights 'Violation' and a human rights 'Abuse'?",["Violations refer to crimes against property, while abuses refer to physical violence.","Violations are committed by state agents (who have primary obligations under treaties), while abuses are committed by non-state actors (such as rebels or criminal groups).","Violations are minor offenses, while abuses are major international war crimes.","Violations are committed by civilians, while abuses are committed by UN peacekeepers."],1,"Under international law, States have primary human rights obligations; thus, state agents commit 'violations,' while non-state actors commit 'abuses.'"],
[42,"2.3 Derechos humanos","Fácil","Which principal treaty is considered part of the 'International Bill of Human Rights' alongside the Universal Declaration of Human Rights?",["The Status of Forces Agreement (SOFA).","The International Covenant on Civil and Political Rights (ICCPR).","The Geneva Conventions of 1949.","The UN Charter's military annex."],1,"The International Bill of Human Rights consists of the UDHR, the ICCPR, and the International Covenant on Economic, Social and Cultural Rights (ICESCR)."],
[43,"2.3 Derechos humanos","Moderada","What is the primary role of the 'Human Rights Component' within a UN multidimensional peacekeeping operation?",["To arrest and prosecute suspected war criminals.","To monitor, report on, and investigate human rights situations, while building national capacity to protect human rights.","To establish a national human rights tribunal led by UN judges.","To draft the constitution and criminal code of the host country."],1,"Human Rights components monitor, investigate, report, and provide capacity-building to support local protection mechanisms."],
[44,"2.3 Derechos humanos","Fácil","How does human rights monitoring contribute to the overall political process of a peacekeeping mission?",["By providing a tool to favor the political faction aligned with the UN.","By identifying early warning signs of violence, preventing abuses, and supporting accountability and national reconciliation.","By collecting evidence to deport political opposition leaders.","By generating revenues through international court fines."],1,"Human rights monitoring provides early warning data, identifies systemic abuses, and supports the transitional justice needed for stable peace."],
[45,"2.3 Derechos humanos","Fácil","What is the responsibility of military and police peacekeepers when they witness human rights violations in the field?",["To ignore them, as human rights are exclusively a civilian task.","To intervene immediately to protect victims within their capabilities, and report the incident through their chain of command.","To photograph the incident and share it directly on personal social media.","To arrest the victims to protect them from further harm."],1,"All peacekeepers have a duty to act within their capabilities to prevent and protect, and must report observed human rights violations immediately."],
[46,"2.4 Protección de civiles","Fácil","Under the operational concept of 'Protection of Civilians' (POC) in UN missions, what are the three distinct 'Tiers' (pillars) that structure the mission's action?",["Tier I: Arrest of opponents; Tier II: Concluding ceasefire pacts; Tier III: Distribution of emergency aid.","Tier I: Dialogue and Political Engagement; Tier II: Physical Protection; Tier III: Establishment of a Protective Environment.","Tier I: Direct air support; Tier II: Border control; Tier III: National judicial prosecution.","Tier I: Municipal administration; Tier II: Economic loans; Tier III: Forced disarmament."],1,"POC relies on three mutually reinforcing Tiers: Tier 1 (Political), Tier 2 (Physical Protection), and Tier 3 (Systemic Protective Environment)."],
[47,"2.4 Protección de civiles","Fácil","Who bears the 'Primary Responsibility' for protecting civilians in a country hosting a UN peacekeeping operation?",["The UN Force Commander.","The host government of the country.","The international humanitarian NGOs.","The UN Security Council."],1,"The host state has the sovereign and primary responsibility to protect all civilians within its borders; the UN mission supports and supplements."],
[48,"2.4 Protección de civiles","Fácil","In a UN mission with a POC mandate, under what circumstances are military contingents authorized to use force to protect civilians?",["Only after obtaining written permission from local police chiefs.","To respond to any political criticism of the mission's leadership.","To protect civilians under imminent threat of physical violence, up to and including the use of lethal force within capabilities and area of deployment.","Only when the military bases are directly under fire by heavy artillery."],2,"Peacekeepers are mandated and authorized to use force, including deadly force, to protect civilians under imminent threat within their capabilities."],
[49,"2.4 Protección de civiles","Fácil","What does 'Tier III' of the Protection of Civilians (Establishment of a Protective Environment) entail?",["The forced evacuation of all civilians to neighboring countries.","Strengthening the rule of law, protecting human rights, professionalizing local police, and creating stable legal frameworks.","The permanent deployment of military guards in every private household.","The suspension of all local political activities."],1,"Tier III works on the structural environment, reforming local security and justice systems to create sustainable, long-term civilian safety."],
[50,"2.4 Protección de civiles","Fácil","What is the 'Joint Protection Committee' (JPC) or similar integrated protection forums in a UN mission?",["A military tribunal that court-martials indisciplined soldiers.","An integrated forum bringing civilian, military, and police components together with humanitarian partners to plan and coordinate protection actions.","A commercial chamber that manages importing supplies for bases.","A diplomatic delegation that visits neighboring nations."],1,"Integrated coordination forums ensure that military patrols, police deployments, and civilian protection actors work in synchrony."],
[51,"2.5 Protección contra CRSV","Moderada","What is the technical definition of 'Conflict-Related Sexual Violence' (CRSV) according to United Nations doctrine?",["Any incident of domestic violence occurring in host countries during a mission.","Acts of sexual violence (rape, sexual slavery, forced prostitution) committed with a direct or indirect link to a conflict situation.","Labor-related sexual harassment within UN offices.","Any crime of a sexual nature prosecuted under international commercial law."],1,"CRSV requires a direct or indirect nexus to an active armed conflict or political instability, often used systematically as a tactic of war."],
[52,"2.5 Protección contra CRSV","Fácil","Why is CRSV considered more than just a human rights issue, but also a matter of international peace and security?",["Because it increases the financial costs of deploying peacekeepers.","Because it is often used systematically as a deliberate tactic of war to terrorize, displace, and break the social cohesion of communities.","Because it prevents local merchants from paying taxes to the UN.","Because it is a mandatory subject in international law courses."],1,"The Security Council recognizes CRSV as a security threat because it acts as an illegal tactic of war, causing trauma and hindering peace."],
[53,"2.5 Protección contra CRSV","Moderada","Who are 'Women Protection Advisers' (WPAs) within a UN peacekeeping mission?",["Military police officers in charge of guarding civilian female quarters.","Specialist civilian officers deployed to monitor, investigate, and coordinate responses to prevent and address CRSV.","Legal defense counselors who represent ex-combatants in local courts.","Medical doctors in charge of administering vaccines to rural women."],1,"WPAs are civilian specialists deployed to investigate, monitor, and advise on preventing and responding to conflict-related sexual violence."],
[54,"2.5 Protección contra CRSV","Fácil","In the context of CRSV prevention, what is the 'Victim-Centred Approach' mandated by the UN?",["An approach that prioritizes the legal defense of the alleged perpetrator.","An approach that prioritizes the rights, safety, dignity, confidentiality, and medical/psychological needs of the survivor at all times.","An administrative process that requires victims to pay for their medical exams.","A policy that keeps victims isolated in military bases for security reasons."],1,"The survivor-centered approach places the victim's safety, dignity, medical, and psychological needs at the center of all actions and investigations."],

[58,"2.6 Protección de la niñez","Fácil","Who are 'Child Protection Advisers' (CPAs) in a UN peacekeeping operation?",["Specialized military guards assigned to protect primary schools.","Civilian specialists deployed to advise mission leadership, monitor, investigate, and report on violations against children.","Judges who try minors in juvenile courts.","Social workers who manage national orphanages."],1,"CPAs advise mission leadership and lead the monitoring and reporting of the six grave violations against children in the field."],

const LETTERS = ["A","B","C","D"];
const quiz = document.getElementById("quiz");
let state = [];
let graded = false;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function build(){
  graded = false;
  quiz.innerHTML = "";
  document.getElementById("result").classList.remove("show");
  document.getElementById("livescore").textContent = "";
  state = DATA.map(q=>{
    const opts = shuffle(q[4].map((t,i)=>({text:t, right:i===q[5]})));
    return {n:q[0], lesson:q[1], dif:q[2], stem:q[3], opts, why:q[6], picked:null};
  });

  state.forEach((q,qi)=>{
    const div = document.createElement("div");
    div.className = "q";
    div.id = "q"+q.n;
    div.innerHTML =
      '<div class="meta">Pregunta '+q.n+' · Lección '+esc(q.lesson)+' · '+esc(q.dif)+'</div>'+
      '<p class="stem">'+esc(q.stem)+'</p>'+
      q.opts.map((o,oi)=>
        '<label data-o="'+oi+'"><input type="radio" name="q'+qi+'" value="'+oi+'">'+
        '<span class="key">'+LETTERS[oi]+'</span><span>'+esc(o.text)+'</span></label>'
      ).join("")+
      '<div class="why" hidden></div>';
    quiz.appendChild(div);
  });

  updateCount();
}

function onPick(e){
  if(!e.target.matches("input[type=radio]") || graded) return;
  const qi = +e.target.name.slice(1);
  state[qi].picked = +e.target.value;
  updateCount();
}

function updateCount(){
  document.getElementById("count").textContent = state.filter(q=>q.picked!==null).length;
}

function grade(){
  graded = true;
  let pts = 0;
  state.forEach((q,qi)=>{
    const card = document.getElementById("q"+q.n);
    const rightIdx = q.opts.findIndex(o=>o.right);
    const ok = q.picked === rightIdx;
    if(ok) pts++;
    card.classList.add(ok ? "correct" : "wrong");
    card.querySelectorAll("label").forEach((lab,oi)=>{
      lab.querySelector("input").disabled = true;
      if(oi === rightIdx) lab.classList.add("is-right");
      if(oi === q.picked && !ok) lab.classList.add("is-picked-wrong");
    });
    const why = card.querySelector(".why");
    why.hidden = false;
    why.innerHTML = '<b>Correcta: '+LETTERS[rightIdx]+'.</b> '+esc(q.why)+
      (q.picked===null ? ' <em>(sin responder)</em>' : '');
  });

  const pct = pts;
  document.getElementById("pts").textContent = pts;
  document.getElementById("pct").textContent = "(" + pct + "%)";
  document.getElementById("verdict").textContent =
    pts>=90 ? "Nivel de examen final asegurado." :
    pts>=75 ? "Aprobado, pero repasá las lecciones donde fallaste." :
    pts>=60 ? "Justo. Volvé sobre las unidades marcadas en rojo." :
              "Repasá el material completo antes de reintentar.";
  document.getElementById("livescore").innerHTML = "Puntaje: <strong>"+pts+"/100</strong>";
  const res = document.getElementById("result");
  res.classList.add("show");
  res.scrollIntoView({behavior:"smooth"});
}

quiz.addEventListener("change", onPick);
document.getElementById("grade").onclick = grade;
document.getElementById("reset").onclick = ()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("reset2").onclick = ()=>{build();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("firstWrong").onclick = ()=>{
  const el = document.querySelector(".q.wrong");
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
};

build();
</script>
